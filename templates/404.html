{% extends 'base.html' %}

{% block title %}Page Not Found | 404 Error{% endblock %}

{% block content %}
<div class="container">
    <div class="notfound-container">
        <div class="notfound-code">404</div>
        <h2>Matrix Sync Error</h2>
        <p>The coordinate vectors you searched do not exist in our system matrices. The route might have moved or is decommissioned.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            <i class="fas fa-home"></i> Back to Homepage
        </a>
    </div>
</div>
{% endblock %}
