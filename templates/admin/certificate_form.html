{% extends 'admin/base_admin.html' %}

{% block title %}Add Certificate{% endblock %}
{% block header_title %}Add Certificate{% endblock %}

{% block admin_content %}

<div class="admin-card">
    <div class="admin-card-header">
        <h2>New Certificate Log</h2>
        <a href="{{ url_for('admin_certificates') }}" class="btn-primary" style="text-decoration: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; background: var(--admin-border);"><i class="fas fa-arrow-left"></i> Back to List</a>
    </div>
    
    <form method="POST" enctype="multipart/form-data" class="admin-form" style="margin-top: 1.5rem;">
        <div class="form-row">
            <div class="form-group" style="grid-column: span 2;">
                <label for="name">Certificate Course Name *</label>
                <input type="text" id="name" name="name" required placeholder="e.g. Machine Learning Specialization">
            </div>
            <div class="form-group">
                <label for="organization">Issuing Organization *</label>
                <input type="text" id="organization" name="organization" required placeholder="e.g. DeepLearning.AI, Stanford University">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="issue_date">Issue Date</label>
                <input type="text" id="issue_date" name="issue_date" placeholder="e.g. June 2024">
            </div>
            <div class="form-group">
                <label for="credential_url">Credential URL / Verification Link</label>
                <input type="url" id="credential_url" name="credential_url" placeholder="https://coursera.org/verify/...">
            </div>
            <div class="form-group">
                <label for="image_file">Certificate Cover Image (PNG, JPG)</label>
                <input type="file" id="image_file" name="image_file">
            </div>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 1.5rem; border: none; padding: 0.8rem 2rem; border-radius: 8px; cursor: pointer; background: var(--admin-success); color: #ffffff; font-size: 1rem; font-weight: 600;">
            <i class="fas fa-save"></i> Save Certificate
        </button>
    </form>
</div>

{% endblock %}
