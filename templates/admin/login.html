<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login | Jawad Ahmad</title>
    
    <!-- Fonts & FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Admin Portal Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-body">
    <div class="admin-login-container">
        <div class="login-card">
            <h2><i class="fas fa-user-shield"></i> Admin Login</h2>
            
            <!-- Flash Message Alerts -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="admin-flash-messages">
                        {% for category, msg in messages %}
                            <div class="alert alert-{{ category }}">
                                <i class="fas {% if category == 'success' %}fa-check-circle{% elif category == 'error' %}fa-exclamation-circle{% else %}fa-info-circle{% endif %}"></i>
                                {{ msg }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            
            <form action="{{ url_for('admin_login') }}" method="POST" class="admin-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter admin username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter admin password">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; border: none; padding: 0.8rem; border-radius: 8px; font-weight: 600; cursor: pointer; background: var(--admin-accent); color: #ffffff;">Log In</button>
            </form>
            
            <div style="text-align: center; margin-top: 1.5rem;">
                <a href="{{ url_for('index') }}" style="color: var(--admin-text-muted); text-decoration: none; font-size: 0.85rem;"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
            </div>
        </div>
    </div>
</body>
</html>
